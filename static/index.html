<html lang="en">
<head>
    <title>Clipboard</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
        }
        #container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .clip-wrapper {
            position: relative;
            display: inline-block;
            border: 1px solid #333;
            border-radius: 6px;
            background: #222;
            padding: 8px;
            width: fit-content;
        }
        .clip-wrapper img {
            display: block;
            border-radius: 4px;
        }
        .clip-controls {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }
        .clip-controls button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .clip-controls button:hover {
            background: rgba(60, 60, 60, 0.9);
        }
        .clip-controls .btn-delete {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener('paste', (event) => {
                let items = event.clipboardData.items;
                for (const itemKey in items) {
                    const item = items[itemKey]
                    if (item.type && item.type.indexOf("image") === 0) {
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            fetch('/clips', {
                                method: "POST", headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({"clip": event.target.result.toString()})
                            }).then(showClips)
                                .catch((error) => {
                                    console.error('Error:', error);
                                });
                        };
                        reader.readAsDataURL(item.getAsFile());
                    }
                }
            }
        );

        function removeAllChildNodes(parent) {
            while (parent.firstChild) {
                parent.removeChild(parent.firstChild);
            }
        }

        function showClips() {
            fetch('/clips')
                .then(response => response.json())
                .then(data => {
                    const container = document.querySelector('#container');
                    removeAllChildNodes(container);

                    for (const clip of data["clips"]) {
                        const wrapper = document.createElement("div");
                        wrapper.className = "clip-wrapper";

                        const img = document.createElement("img");
                        img.src = "/clips/" + clip;

                        const controls = document.createElement("div");
                        controls.className = "clip-controls";

                        const btnDelete = document.createElement("button");
                        btnDelete.className = "btn-delete";
                        btnDelete.textContent = "✕";
                        btnDelete.title = "Delete";
                        btnDelete.onclick = () => {
                            fetch('/clips/' + clip, {method: "DELETE"}).then(showClips)
                                .catch((error) => { console.error('Error:', error); });
                        };

                        function scaleAndSave(img, clip, factor) {
                            const canvas = document.createElement("canvas");
                            const newWidth = Math.round(img.naturalWidth * factor);
                            const newHeight = Math.round(img.naturalHeight * factor);
                            canvas.width = newWidth;
                            canvas.height = newHeight;
                            const ctx = canvas.getContext("2d");
                            ctx.drawImage(img, 0, 0, newWidth, newHeight);
                            const dataUrl = canvas.toDataURL("image/png");
                            fetch('/clips/' + clip, {
                                method: "PUT",
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({"clip": dataUrl})
                            }).then(showClips)
                              .catch((error) => { console.error('Error:', error); });
                        }

                        const btnUp = document.createElement("button");
                        btnUp.textContent = "▲";
                        btnUp.title = "Scale up (2×)";
                        btnUp.onclick = () => { scaleAndSave(img, clip, 2); };

                        const btnDown = document.createElement("button");
                        btnDown.textContent = "▼";
                        btnDown.title = "Scale down (0.5×)";
                        btnDown.onclick = () => { scaleAndSave(img, clip, 0.5); };

                        controls.appendChild(btnDelete);
                        controls.appendChild(btnUp);
                        controls.appendChild(btnDown);
                        wrapper.appendChild(controls);
                        wrapper.appendChild(img);
                        container.appendChild(wrapper);
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
        }

        window.addEventListener("load", showClips);

    </script>
</head>
<body>
<div id="container">
</div>
</body>
</html>
